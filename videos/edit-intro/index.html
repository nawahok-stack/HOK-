<!doctype html>
<html
  lang="th"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"สีเน้น","default":"#FF5A36"},
    {"id":"footage","type":"string","label":"ฟุตเทจ","default":"assets/talk.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Prompt";
        font-weight: 500;
        src: url("assets/fonts/Prompt-thai-500.woff2") format("woff2");
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: "Prompt";
        font-weight: 500;
        src: url("assets/fonts/Prompt-latin-500.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-21FF;
      }
      @font-face {
        font-family: "Prompt";
        font-weight: 800;
        src: url("assets/fonts/Prompt-thai-800.woff2") format("woff2");
        unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: "Prompt";
        font-weight: 800;
        src: url("assets/fonts/Prompt-latin-800.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2190-21FF;
      }
      :root {
        --ground: #0e0f14;
        --ink: #ffffff;
        --accent: #ff5a36;
        --glass: rgba(15, 16, 22, 0.8);
        --font-display: "Prompt", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 38%;
      }
      #talk {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <div id="cam">
        <video
          id="talk"
          class="clip"
          src="assets/talk.mp4"
          data-var-src="footage"
          data-start="0"
          data-duration="15"
          data-media-start="0"
          data-track-index="0"
          data-has-audio="true"
          data-volume="1"
          data-fade-out="0.8"
          playsinline
        ></video>
      </div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="trim"
        data-composition-id="trim"
        data-composition-src="compositions/trim.html"
        data-start="3"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="graphics"
        data-composition-id="graphics"
        data-composition-src="compositions/graphics.html"
        data-start="6"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="export"
        data-composition-id="export"
        data-composition-src="compositions/export.html"
        data-start="9"
        data-duration="2.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="11.8"
        data-duration="3.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // The camera: punch-ins live on the wrapper, never on the timed <video>.
      tl.set("#cam", { scale: 1, x: 0, y: 0 }, 0);
      // 01 ตัด + ซูม — hard punch-in on the cut, then a second, tighter one.
      tl.set("#cam", { scale: 1.22, y: -40 }, 3.0);
      tl.set("#cam", { scale: 1.4, y: -110 }, 4.5);
      // 02 กราฟิก — back to the wide so the card has room.
      tl.to("#cam", { scale: 1.08, y: -120, duration: 0.6, ease: "power2.inOut" }, 6.0);
      // 03 Render — slow push while the bar fills.
      tl.to("#cam", { scale: 1.16, y: -80, duration: 2.8, ease: "none" }, 9.0);
      // Outro — settle wide under the end card.
      tl.to("#cam", { scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 11.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
